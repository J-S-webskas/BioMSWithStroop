[versions]
agp = "8.9.0"

mediapipe-tasks-vision = "0.10.11"
mediapipe-tasks-core = "0.10.13"
camerax = "1.5.2"  # For CameraX

# Use older, stable versions compatible with SDK 34
appcompat = "1.6.1"
material = "1.9.0"
#activity = "1.7.2"
constraintlayout = "2.1.4"
core = "1.10.1"
coreKtx = "1.10.1"

junit = "4.13.2"
extJunit = "1.1.5"  # Correct name - you're using this
espresso = "3.5.1"  # Correct name - you're using this

# MPAndroidChart version
mpandroidchart = "3.1.0"
cameraView = "1.5.2"

[libraries]
# Core libraries - ADD THESE
core = { group = "androidx.core", name = "core", version.ref = "core" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# UI libraries
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Testing libraries - FIXED THESE
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }  # Fixed: extJunit not junitVersion
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }  # Fixed: espresso not espressoCore

# MPAndroidChart library
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraView" }

mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe-tasks-vision" }
mediapipe-tasks-core = { group = "com.google.mediapipe", name = "tasks-core", version.ref = "mediapipe-tasks-core" }

# Add CameraX libraries if not already there:
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }